name: Publish Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v3.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Determine source ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source (at tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          path: source

      - name: Configure SSH for distribution repo
        env:
          DEPLOY_KEY: ${{ secrets.AI_BRAIN_PLUGIN_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone distribution repo
        run: git clone git@github.com:flippyhead/ai-brain-plugin.git dist

      - name: Detect distribution default branch
        id: distbranch
        run: |
          cd dist
          BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist in distribution
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          cd dist
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists in distribution repo. Bump the source version or delete the distribution tag before retrying."
            exit 1
          fi

      - name: Clear distribution contents (preserve .git and README.md)
        run: |
          cd dist
          shopt -s dotglob
          for item in *; do
            case "$item" in
              .git|README.md) continue ;;
              *) rm -rf -- "$item" ;;
            esac
          done

      - name: Copy plugin source into distribution
        run: |
          cp -R source/plugins/ai-brain/. dist/

      - name: Generate flat marketplace.json in distribution
        run: |
          cd source
          node .github/scripts/generate-dist-marketplace.mjs ../dist/.claude-plugin/marketplace.json

      - name: Configure git in dist
        run: |
          cd dist
          git config user.name "ai-brain CI"
          git config user.email "ci@ai-brain.local"

      - name: Commit plugin snapshot (if content changed)
        id: publish
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          cd dist
          git add -A
          if git diff --staged --quiet; then
            echo "No content changes since last publish — skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "release: ai-brain $TAG (from flippyhead/ai-brain@$TAG)"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag distribution
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          cd dist
          git tag "$TAG"

      - name: Push commit (if any)
        if: steps.publish.outputs.committed == 'true'
        env:
          BRANCH: ${{ steps.distbranch.outputs.branch }}
        run: |
          cd dist
          git push origin "$BRANCH"

      - name: Push tag
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          cd dist
          git push origin "$TAG"

      - name: Summary
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          BRANCH: ${{ steps.distbranch.outputs.branch }}
          CHANGED: ${{ steps.publish.outputs.committed }}
        run: |
          echo "Source tag: $TAG"
          echo "Distribution: https://github.com/flippyhead/ai-brain-plugin (branch: $BRANCH)"
          echo "Committed: $CHANGED"
